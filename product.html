<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Producto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-container"></div>

    <main class="product-container">
        <div class="gallery">
            <img src="" alt="Imagen de Producto" class="main-image" id="mainImage">
            <div class="thumbnails"></div>
        </div>

        <div class="product-info">
            <div class="breadcrumb" id="productBreadcrumb">Drop 01</div>
            <h1 class="product-title">Cargando...</h1>
            <div class="product-price">-- €</div>
            <p class="product-description"></p>

            <div class="color-section">
                <h4>Color: <span class="color-name-label" id="colorLabel">-</span></h4>
                <div class="colors"></div>
            </div>

            <div class="size-section">
                <h4>Selecciona tu talla:</h4>
                <div class="sizes">
                    <div class="size-box">S</div>
                    <div class="size-box active">M</div>
                    <div class="size-box">L</div>
                    <div class="size-box">XL</div>
                </div>
            </div>

            <a href="#" class="btn-order" target="_blank" id="btnBuy" style="text-align: center; font-size: 1rem; padding: 15px;">
                <i class="fab fa-whatsapp"></i> Hacer Pedido
            </a>
        </div>
    </main>

    <section class="related-section container" style="display: none;" id="relatedSection">
        <h3>Completa tu fit</h3>
        <div class="carousel-container">
            <div class="carousel" id="relatedCarousel">
                </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script src="products-data.js"></script>
    <script>
        renderHeader('static-nav', true);
        renderFooter();

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const product = BAVU_INVENTORY.find(p => p.id === productId);

        if (product) {
            document.title = product.title.replace('<br>', ' ') + ' | BAVU';
            document.querySelector('.product-title').innerHTML = product.title;
            document.querySelector('.product-price').textContent = product.price;
            document.querySelector('.product-description').textContent = product.description;
            document.getElementById('mainImage').src = product.mainImage;
            document.getElementById('btnBuy').href = `https://wa.me/34600000000?text=${encodeURIComponent(product.waMessage)}`;

            // Miniaturas
            const thumbContainer = document.querySelector('.thumbnails');
            product.thumbnails.forEach((imgUrl, idx) => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = `thumb ${idx === 0 ? 'active-thumb' : ''}`;
                img.onclick = function() {
                    document.getElementById('mainImage').src = this.src;
                    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active-thumb'));
                    this.classList.add('active-thumb');
                };
                thumbContainer.appendChild(img);
            });

            // Colores
            const colorsContainer = document.querySelector('.colors');
            product.colors.forEach(c => {
                const circle = document.createElement('div');
                circle.className = `color-circle ${c.id === productId ? 'active' : ''}`;
                circle.style.backgroundColor = c.hex;
                if (c.id === productId) document.getElementById('colorLabel').textContent = c.name;
                circle.onclick = () => { if(c.id !== productId) window.location.href = `product.html?id=${c.id}`; };
                colorsContainer.appendChild(circle);
            });

            // Tallas
            const sizeBoxes = document.querySelectorAll('.size-box');
            sizeBoxes.forEach(box => {
                box.addEventListener('click', function() {
                    sizeBoxes.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // PRODUCTOS RELACIONADOS
            if (product.relatedProducts && product.relatedProducts.length > 0) {
                document.getElementById('relatedSection').style.display = 'block';
                const carousel = document.getElementById('relatedCarousel');
                
                product.relatedProducts.forEach(relId => {
                    const relProduct = BAVU_INVENTORY.find(p => p.id === relId);
                    if (relProduct) {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${relProduct.mainImage}" alt="" class="product-img">
                            <div class="product-info">
                                <h3>${relProduct.title}</h3>
                                <span class="price">${relProduct.price}</span>
                                <a href="product.html?id=${relProduct.id}" class="btn-order">Ver Detalles</a>
                            </div>
                        `;
                        carousel.appendChild(card);
                    }
                });
            }
        }
    </script>
</body>
</html>
