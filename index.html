<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Coming Soon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS EXCLUSIVOS PRE-LANZAMIENTO CORREGIDOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh; /* Cambiado a min-height para adaptarse dinámicamente a pantallas cortas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            /* Eliminado overflow: hidden para evitar que corte contenido en móviles */
        }

        /* Contenedor Principal (Centro) */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 40px 20px; /* Añadido un padding seguro */
        }

        /* Animación suave de entrada para el logo */
        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 30px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Texto principal */
        .landing-text {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: #94a3b8; /* Color --accent original */
            display: flex;
            align-items: center;
        }

        /* --- ANIMACIÓN DE LOS PUNTOS --- */
        .dots span {
            opacity: 0;
            animation: blink 1.8s infinite;
            font-weight: 700;
            color: #ffffff;
        }
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.4s; }
        .dots span:nth-child(3) { animation-delay: 0.8s; }

        @keyframes blink {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FOOTER REDES SOCIALES --- */
        .social-footer {
            width: 100%;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            gap: 50px;
            border-top: 1px solid #111;
            flex-shrink: 0; /* Fuerza al footer a mantener su tamaño y no aplastarse */
        }

        .social-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.3s ease;
            white-space: nowrap; /* Evita que el texto se parta en dos líneas de forma fea */
        }

        .social-link:hover {
            color: #94a3b8;
        }

        .social-link i {
            font-size: 1.4rem;
        }

        /* Adaptación perfecta para móviles */
        @media (max-width: 600px) {
            .social-footer {
                flex-direction: column;
                align-items: center;
                gap: 18px; /* Espaciado cómodo entre los dos enlaces */
                padding: 25px 20px;
            }
            .logo {
                max-width: 220px; /* Logo ligeramente más compacto en móvil */
                margin-bottom: 20px;
            }
            .landing-text {
                font-size: 1.1rem;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <img src="img/BAVU_white.png" alt="BAVU Logo" class="logo">
        <h1 class="landing-text">
            IS LANDING
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </h1>
    </main>

    <footer class="social-footer">
        <a href="https://www.instagram.com/bavu.clothing" target="_blank" class="social-link">
            <i class="fab fa-instagram"></i> @bavu.clothing
        </a>
        <a href="https://www.tiktok.com/@bavu.clothing" target="_blank" class="social-link">
            <i class="fab fa-tiktok"></i> @bavu.clothing
        </a>
    </footer>

</body>
</html>
