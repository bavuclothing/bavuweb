<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU</title>
    
    <link rel="icon" type="image/png" href="img/BAVU_white_ico.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* --- ESTILOS COMPACTOS CENTRALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor Único Central */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* Entrada suave del logo (2 segundos) */
        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 25px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Texto principal con animación fade */
        .landing-text {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            display: flex;
            align-items: center;
            margin-bottom: 45px;
            animation: fadeIn 2.2s ease-in-out;
        }

        /* --- ANIMACIÓN DE LOS PUNTOS --- */
        .dots span {
            opacity: 0;
            animation: blink 1.8s infinite;
            font-weight: 700;
            color: #94a3b8;
        }
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.4s; }
        .dots span:nth-child(3) { animation-delay: 0.8s; }

        @keyframes blink {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Animación base de fundido */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CONTENEDOR DE REDES SOCIALES --- */
        .social-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; /* Espacio entre la primera fila y la segunda (Escritorio) */
            animation: fadeIn 2.5s ease-in-out;
            width: 100%;
        }

        /* Filas de redes independientes para controlar el orden */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .social-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .social-link:hover {
            color: #94a3b8;
        }

        .social-link i {
            font-size: 1.3rem;
        }

        /* --- Adaptación perfecta para pantallas móviles --- */
        @media (max-width: 600px) {
            .social-container {
                flex-direction: row; /* Coloca ambas filas una al lado de la otra */
                justify-content: center;
                gap: 25px; /* Espaciado uniforme */
            }
            .social-row {
                flex-direction: row; /* Mantiene los iconos en horizontal */
                gap: 25px; /* Espaciado uniforme */
                width: auto;
            }
            .social-text {
                display: none; /* Oculta el texto en móviles */
            }
            .social-link i {
                font-size: 1.6rem; /* Hace los iconos un poco más grandes para móvil */
            }
            .logo {
                max-width: 220px;
                margin-bottom: 20px;
            }
            .landing-text {
                font-size: 1.1rem;
                letter-spacing: 6px;
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <img src="img/BAVU_white.png" alt="BAVU Logo" class="logo">
        
        <h1 class="landing-text">
            LOADING
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </h1>
        
        <div class="social-container">
            <div class="social-row">
                <a href="https://www.instagram.com/bavu.clothing" target="_blank" class="social-link">
                    <i class="fab fa-instagram"></i><span class="social-text">@bavu.clothing</span>
                </a>
                <a href="https://www.tiktok.com/@bavu.clothing" target="_blank" class="social-link">
                    <i class="fab fa-tiktok"></i><span class="social-text">@bavu.clothing</span>
                </a>
            </div>
            
            <div class="social-row">
                <a href="https://www.facebook.com/clothing.bavu" target="_blank" class="social-link">
                    <i class="fab fa-facebook"></i><span class="social-text">@clothing.bavu</span>
                </a>
                <a href="https://x.com/bavuclothing" target="_blank" class="social-link">
                    <i class="fab fa-x-twitter"></i><span class="social-text">@bavuclothing</span>
                </a>
            </div>
        </div>
        
    </main>

</body>
</html>
