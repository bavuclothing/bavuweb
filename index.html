<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Fuerza Bruta • Aesthetic Gymwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-container"></div>

    <!-- 1. Texto de bienvenida limpio sin imagen hero de fondo -->
    <header class="welcome-block">
        <h1>¡Bienvenido a BAVU!</h1>
    </header>

    <main class="home-section-container">

        <!-- 2. Carrusel General Editable -->
        <section class="carousel-section" style="margin-bottom: 40px;">
            <h2 class="section-block-title" style="font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; border-left: 3px solid var(--accent); padding-left: 12px;">Destacados de la marca</h2>
            <div class="carousel-container">
                <div class="carousel" id="carouselHomeGeneral"></div>
            </div>
        </section>

        <!-- 3. Header de ELLAS (Tamaño reducido) -->
        <a href="products-ellas.html?cat=mujer" class="category-header header-women small-header">
            <h2>ELLAS</h2>
            <span>Ver colección</span>
        </a>

        <!-- 4. Carrusel de Productos para Mujeres -->
        <section class="carousel-section" style="margin-bottom: 40px;">
            <div class="carousel-container">
                <div class="carousel" id="carouselHomeWomen"></div>
            </div>
        </section>

        <!-- 5. Header de ELLOS (Tamaño reducido) -->
        <a href="products-ellos.html?cat=hombre" class="category-header header-men small-header">
            <h2>ELLOS</h2>
            <span>Ver colección</span>
        </a>

        <!-- 6. Carrusel de Productos para Hombres -->
        <section class="carousel-section" style="margin-bottom: 50px;">
            <div class="carousel-container">
                <div class="carousel" id="carouselHomeMen"></div>
            </div>
        </section>

        <!-- 7. Lista Final en Rejilla (2 columnas en móvil / 4 columnas en PC) -->
        <section class="grid-section" style="margin-top: 60px;">
            <h2 class="section-block-title" style="font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; border-left: 3px solid var(--accent); padding-left: 12px;">Colección Completa</h2>
            <div class="products-responsive-grid" id="gridHomeFinal"></div>
        </section>

        <section class="grid-section" style="margin-top: 60px;">            
            <div class="view-all-container">
                <a href="products.html?cat=todo" class="btn-view-all">Ver todo</a>
            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script src="products-data.js"></script>
    <script>
        // Renderizar componentes de cabecera fija y pie de página[cite: 17]
        renderHeader('fixed-nav');
        renderFooter();

        // 🎯 PANEL DE CONTROL DE LA HOME POR ID
        // Configura las prendas que deseas mostrar en cada bloque específico:

        // IDs para el primer carrusel general superior:
        const idsGeneral = ["heavy-hoodie-blackout", "taper-halfzip-forest", "bra-longline-lilac"];

        // IDs para el carrusel de prendas de mujer (debajo del banner ELLAS):
        const idsWomen = ["seamless-crop-onyx", "seamless-short-onyx", "seamless-legging-onyx", "bra-onyx"];

        // IDs para el carrusel de prendas de hombre (debajo del banner ELLOS):
        const idsMen = ["taper_baselayer", "taper-tee-shadow", "taper-tee-ash", "taper-tank-blackout"];

        // IDs para la cuadrícula final responsiva inferior:
        const idsGridFinal = ["heavy-tee-blackout", "heavy-tee-olive", "heavy-tee-white", "split-short-black", "split-short-grey", "essential-socks-white"];


        // 🛠️ Función inyectora automatizada de tarjetas de producto
        function injectProductsToHome(idArray, targetContainerId) {
            const container = document.getElementById(targetContainerId);
            if (!container) return;

            idArray.forEach(id => {
                const product = BAVU_INVENTORY.find(p => p.id === id);
                if (product) {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    const cleanTitle = product.title.replace('<br>', ' ');
                    card.innerHTML = `
                        <img src="${product.mainImage}" alt="${cleanTitle}" class="product-img">
                        <div class="product-info">
                            <h3>${product.title}</h3>
                            <span class="price">${renderProductPrice(product)}</span> <a href="product.html?id=${product.id}" class="btn-order">Ver Detalles</a>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        // 🚀 Despliegue masivo de datos en la interfaz de la Home
        injectProductsToHome(idsGeneral, "carouselHomeGeneral");
        injectProductsToHome(idsWomen, "carouselHomeWomen");
        injectProductsToHome(idsMen, "carouselHomeMen");
        injectProductsToHome(idsGridFinal, "gridHomeFinal");

    </script>
</body>
</html>
