<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Fuerza Bruta • Aesthetic Gymwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-container"></div>

    <header class="hero">
        <img src="img/BAVU_white.png" alt="BAVU Logo" class="hero-logo">
        <p>Fuerza Bruta • Diseño Minimalista</p>
    </header>

    <!-- Sección de Categorías Clásicas -->
    <section class="split-sections" id="categorias">
        <div class="category-col">
            <a href="products.html?cat=mujer" class="category-header header-women">
                <h2>ELLAS</h2>
                <span>Ver colección</span>
            </a>
        </div>
        <div class="category-col">
            <a href="products.html?cat=hombre" class="category-header header-men">
                <h2>ELLOS</h2>
                <span>Ver colección</span>
            </a>
        </div>
        <div class="category-col" style="grid-column: 1 / -1;">
            <a href="products.html?cat=todo" class="category-header" style="height: 200px; background: #222;">
                <h2>TODO</h2>
                <span>Ver catálogo completo</span>
            </a>
        </div>
    </section>

    <!-- NUEVA SECCIÓN: Carrusel de Productos Destacados en Home -->
    <section class="related-section container" id="featuredSection" style="margin-top: 20px; padding-top: 40px;">
        <h3>Productos Destacados</h3>
        <div class="carousel-container">
            <div class="carousel" id="featuredCarousel"></div>
        </div>
    </section>

    <div id="footer-container"></div>

    <!-- Scripts de Datos y Componentes -->
    <script src="products-data.js"></script>
    <script src="components.js"></script>
    <script>
        // Renderizar elementos comunes globales
        renderHeader('fixed-nav');
        renderFooter();

        // 🎯 TU LISTA CONFIGURABLE DE ID'S DESTACADOS:
        // Modifica estos strings con los ID's exactos que quieras resaltar en la Home
        const featuredProductIds = [
            "taper-tee-shadow"
        ];

        const carouselContainer = document.getElementById('featuredCarousel');

        // Procesar e inyectar las tarjetas dinámicamente en el Slider
        featuredProductIds.forEach(id => {
            const product = BAVU_INVENTORY.find(p => p.id === id);
            if (product) {
                const card = document.createElement('div');
                card.className = 'product-card';
                const cleanTitle = product.title.replace('<br>', ' ');
                
                card.innerHTML = `
                    <img src="${product.mainImage}" alt="${cleanTitle}" class="product-img">
                    <div class="product-info">
                        <h3>${product.title}</h3>
                        <span class="price">${product.price}</span>
                        <a href="product.html?id=${product.id}" class="btn-order">Ver Detalles</a>
                    </div>
                `;
                carouselContainer.appendChild(card);
            }
        });

        // Ocultar la sección automáticamente si no se configuran ID's válidos
        if (carouselContainer.children.length === 0) {
            document.getElementById('featuredSection').style.display = 'none';
        }
    </script>
</body>
</html>
