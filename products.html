<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Cabecera limpia y ultracompacta */
        .catalog-clean-header {
            padding: 50px 5% 15px;
            text-align: center;
            background: transparent;
        }
        .catalog-clean-header h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            color: var(--text-body);
        }
        
        /* Contenedor optimizado para el catálogo híbrido */
        .catalog-hybrid-layout {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto 60px;
        }

        /* Títulos de las secciones */
        .section-block-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 40px 0 20px 0;
            color: var(--text-body);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }

        /* 🎯 LA REJILLA RESPONSIVA REQUERIDA (2 columnas móvil / 4 columnas PC) */
        .products-responsive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas reales por fila en móvil */
            gap: 15px; /* Espaciado ajustado para pantallas pequeñas */
            width: 100%;
        }

        /* Adaptación a ordenadores (Desktop) */
        @media (min-width: 900px) {
            .products-responsive-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 columnas reales por fila en PC */
                gap: 30px; /* Espaciado más amplio y premium en escritorio */
            }
        }

        /* Ajuste estético menor para que las tarjetas se adapten bien al formato de 2 columnas en móvil */
        @media (max-width: 600px) {
            .products-responsive-grid .product-card {
                max-width: 100% !important; /* Anula el max-width de 320px del CSS global para que encajen dos */
            }
            .products-responsive-grid .product-card .product-info h3 {
                font-size: 0.8rem; /* Texto un pelín más compacto para evitar saltos feos en móvil */
            }
            .products-responsive-grid .product-card .btn-order {
                font-size: 0.7rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <header class="catalog-clean-header">
        <h1 id="catalogTitle">COLECCIÓN</h1>
    </header>

    <main class="catalog-hybrid-layout">
        <!-- 1. BLOQUE SUPERIOR: Carrusel Horizontal -->
        <section id="carouselSectionContainer">
            <h2 class="section-block-title">Novedades Destacadas</h2>
            <div class="carousel-container">
                <div class="carousel" id="carouselWrapper"></div>
            </div>
        </section>

        <!-- 2. BLOQUE INFERIOR: Rejilla Responsiva (2xMóvil / 4xPC) -->
        <section id="gridSectionContainer">
            <h2 class="section-block-title"></h2>
            <div class="products-responsive-grid" id="gridWrapper"></div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script src="products-data.js"></script>
    <script>
        renderHeader('static-nav', true);
        renderFooter();

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat');
        const catalogTitle = document.getElementById('catalogTitle');
        const carouselWrapper = document.getElementById('carouselWrapper');
        const gridWrapper = document.getElementById('gridWrapper');

        // Modificación del título según la categoría activa de la web
        if (category === 'hombre') {
            document.title = "BAVU | Colección Hombre";
            catalogTitle.textContent = "COLECCIÓN HOMBRE";
        } else if (category === 'mujer') {
            document.title = "BAVU | Colección Mujer";
            catalogTitle.textContent = "COLECCIÓN MUJER";
        } else {
            catalogTitle.textContent = "CATÁLOGO COMPLETO";
        }

        // Función inteligente para verificar si el producto pertenece a la sección activa
        const productMatchesCategory = (product) => {
            if (category === 'hombre') return product.forMen;
            if (category === 'mujer') return product.forWomen;
            return true; // Si es 'todo' o no hay filtro, entran todos[cite: 19]
        };

        // 🎯 PANEL DE CONTROL: SELECCIÓN DE PRODUCTOS POR ID
        // Cambia estos IDs por los que tú quieras mostrar en cada zona:

        // 1. IDs elegidos para el CARRUSEL horizontal superior:
        const chosenForCarousel = [
            "taper_baselayer",
            "taper-tee-shadow",
            "taper-tee-ash",
            "taper-tank-blackout",
            "split-short-black",
            "heavy-tee-blackout",
            "seamless-crop-onyx",
            "bra-onyx"
        ];

        // 2. IDs elegidos para la LISTA EN REJILLA (2 en móvil / 4 en PC) inferior:
        const chosenForGrid = [
            "taper-halfzip-forest",
            "heavy-hoodie-blackout",
            "bra-longline-lilac",
            "seamless-short-onyx"
        ];

        // 🛠️ RENDERIZADO 1: Carrusel Superior
        let carouselCount = 0;
        chosenForCarousel.forEach(id => {
            const product = BAVU_INVENTORY.find(p => p.id === id);
            // Solo se muestra si el ID existe y además coincide con el género seleccionado (Ellos/Ellas)
            if (product && productMatchesCategory(product)) {
                carouselCount++;
                const card = document.createElement('div');
                card.className = 'product-card';
                const cleanTitle = product.title.replace('<br>', ' ');
                card.innerHTML = `
                    <img src="${product.mainImage}" alt="${cleanTitle}" class="product-img">
                    <div class="product-info">
                        <h3>${product.title}</h3>
                        <span class="price">${product.price}</span>
                        <a href="product.html?id=${product.id}" class="btn-order">Ver Detalles</a>
                    </div>
                `;
                carouselWrapper.appendChild(card);
            }
        });
        // Si no hay ningún producto válido en el carrusel para este género, ocultamos la sección entera
        if (carouselCount === 0) {
            document.getElementById('carouselSectionContainer').style.display = 'none';
        }

        // 🛠️ RENDERIZADO 2: Rejilla Inferior (Filas de 2 en móvil / 4 en PC)
        let gridCount = 0;
        chosenForGrid.forEach(id => {
            const product = BAVU_INVENTORY.find(p => p.id === id);
            if (product && productMatchesCategory(product)) {
                gridCount++;
                const card = document.createElement('div');
                card.className = 'product-card';
                const cleanTitle = product.title.replace('<br>', ' ');
                card.innerHTML = `
                    <img src="${product.mainImage}" alt="${cleanTitle}" class="product-img">
                    <div class="product-info">
                        <h3>${product.title}</h3>
                        <span class="price">${product.price}</span>
                        <a href="product.html?id=${product.id}" class="btn-order">Ver Detalles</a>
                    </div>
                `;
                gridWrapper.appendChild(card);
            }
        });
        // Si no hay productos en la rejilla o la lista está vacía, mostramos un aviso
        if (gridCount === 0) {
            gridWrapper.parentNode.innerHTML = '<p style="text-align:center; color:#666; padding: 30px 0;">Próximamente disponibles nuevos artículos en esta sección.</p>';
        }
    </script>
</body>
</html>
