<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVU | Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-container"></div>

    <header class="hero" id="catalogHero">
        <h1 class="section-title" id="catalogTitle" style="margin-bottom: 0; font-size: 3rem; font-weight: 900; letter-spacing: 10px;">COLECCIÓN</h1>
    </header>

    <main class="container" style="width: 80%; max-width: 1600px; margin: 50px auto;">
        <div class="grid" id="productsGrid"></div>
    </main>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script src="products-data.js"></script>
    <script>
        renderHeader('static-nav', true);
        renderFooter();

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat');
        const catalogTitle = document.getElementById('catalogTitle');
        const catalogHero = document.getElementById('catalogHero');
        const productsGrid = document.getElementById('productsGrid');

        let filteredProducts = [];

        if (category === 'hombre') {
            document.title = "BAVU | Colección Hombre";
            catalogTitle.textContent = "COLECCIÓN HOMBRE";
            catalogHero.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?q=80&w=1000&auto=format&fit=crop')";
            filteredProducts = BAVU_INVENTORY.filter(p => p.forMen);
        } else if (category === 'mujer') {
            document.title = "BAVU | Colección Mujer";
            catalogTitle.textContent = "COLECCIÓN MUJER";
            catalogHero.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1518310383802-640c2de311b2?q=80&w=1000&auto=format&fit=crop')";
            filteredProducts = BAVU_INVENTORY.filter(p => p.forWomen);
        } else {
            // "todo" o sin categoría
            catalogTitle.textContent = "CATÁLOGO COMPLETO";
            filteredProducts = BAVU_INVENTORY;
        }

        // ORDENAR DE MAYOR A MENOR SEGÚN EL CAMPO "order"
        filteredProducts.sort((a, b) => (b.order || 0) - (a.order || 0));

        if (filteredProducts.length === 0) {
            productsGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#666;">Próximamente disponibles.</p>';
        } else {
            productsGrid.innerHTML = ''; 
            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const cleanTitle = product.title.replace('<br>', ' ');
                card.innerHTML = `
                    <img src="${product.mainImage}" alt="${cleanTitle}" class="product-img">
                    <div class="product-info">
                        <h3>${product.title}</h3>
                        <span class="price">${product.price}</span>
                        <a href="product.html?id=${product.id}" class="btn-order">Ver Detalles</a>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
